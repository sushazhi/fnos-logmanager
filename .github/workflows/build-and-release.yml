name: Build and Release LogManager for fnOS

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build LogManager
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from manifest
        run: |
          APP_VERSION=$(grep '^version[[:space:]]*=' manifest | sed 's/^version[[:space:]]*=[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$APP_VERSION" ]; then
            echo "ERROR: Failed to read version from manifest"
            exit 1
          fi
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "APP_VERSION=${APP_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Vue frontend
        run: |
          cd app/ui
          npm install
          npm run build

      - name: Verify Vue build
        run: |
          if [ ! -d "app/ui/dist" ]; then
            echo "ERROR: Vue build output not found"
            exit 1
          fi
          echo "Vue build complete"
          ls -la app/ui/dist/

      - name: Build Go server binaries
        run: |
          cd app/server
          
          # Build for x86_64
          echo "Building for linux/amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o logmanager-server-amd64 -ldflags="-s -w" ./cmd/server
          if [ ! -f "logmanager-server-amd64" ]; then
            echo "ERROR: amd64 build output not found"
            exit 1
          fi
          file_size=$(stat -c%s logmanager-server-amd64)
          echo "  amd64: $(echo "scale=2; $file_size / 1048576" | bc) MB"
          
          # Build for ARM64
          echo "Building for linux/arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o logmanager-server-arm64 -ldflags="-s -w" ./cmd/server
          if [ ! -f "logmanager-server-arm64" ]; then
            echo "ERROR: arm64 build output not found"
            exit 1
          fi
          file_size=$(stat -c%s logmanager-server-arm64)
          echo "  arm64: $(echo "scale=2; $file_size / 1048576" | bc) MB"
          
          ls -lh logmanager-server-*

      - name: Download fnpack
        run: |
          FNPACK_URL="https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64"
          wget -q "$FNPACK_URL" -O fnpack
          if [ ! -s fnpack ]; then
            echo "ERROR: fnpack download failed or file is empty"
            exit 1
          fi
          chmod +x fnpack
          echo "fnpack downloaded ($(stat -c%s fnpack) bytes)"

      - name: Setup build directory
        run: |
          # Mirror build.ps1 [1/5]: clean and recreate build directory
          echo "Setting up build directory..."
          mkdir -p build/app/ui
          mkdir -p build/app/server
          mkdir -p build/cmd
          mkdir -p build/config
          mkdir -p build/wizard

      - name: Copy project files to build directory
        run: |
          # Mirror build.ps1 [3/5]: copy all project files

          # Root files
          cp -r cmd/* build/cmd/
          cp -r config/* build/config/
          cp -r wizard/* build/wizard/

          # Inject version into build manifest (mirror build.ps1 manifest update)
          sed "s/^version[[:space:]]*=.*/version = ${APP_VERSION}/" manifest > build/manifest

          for file in ICON.PNG ICON_256.PNG; do
            if [ -f "$file" ]; then cp "$file" build/; fi
          done

          # Vue build output
          cp -r app/ui/dist/* build/app/ui/
          if [ -f "app/ui/config" ]; then cp -r app/ui/config build/app/ui/; fi
          if [ -d "app/ui/images" ]; then cp -r app/ui/images build/app/ui/; fi

          echo "Project files copied"

      - name: Copy compiled server binaries
        run: |
          # Copy Go binaries (both architectures)
          for bin in logmanager-server-amd64 logmanager-server-arm64; do
            if [ -f "app/server/$bin" ]; then
              cp "app/server/$bin" "build/app/server/$bin"
              chmod +x "build/app/server/$bin"
              file_size=$(stat -c%s "build/app/server/$bin")
              echo "  $bin: $(echo "scale=2; $file_size / 1048576" | bc) MB"
            fi
          done
          echo "Server binaries copied"

      - name: Create .fpk package
        run: |
          # Mirror build.ps1 [5/5]: run fnpack build
          cd build
          ../fnpack build .

          if [ ! -f "logmanager.fpk" ]; then
            echo "ERROR: fnpack did not generate logmanager.fpk"
            exit 1
          fi

          PACKAGE_NAME="logmanager-${APP_VERSION}.fpk"
          mv logmanager.fpk "../${PACKAGE_NAME}"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "Created package: ${PACKAGE_NAME}"
          ls -lh "../${PACKAGE_NAME}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LogManager-fpk
          path: ${{ env.PACKAGE_NAME }}
          retention-days: 30

      - name: Calculate package checksum
        run: |
          SHA256=$(sha256sum "${PACKAGE_NAME}" | awk '{print $1}')
          echo "PACKAGE_SHA256=${SHA256}" >> $GITHUB_ENV
          echo "SHA256: ${SHA256}"

      - name: Build summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## ✅ Build Summary

          **Version:** ${{ env.APP_VERSION }}

          **Git Info:**
          - Commit: \`${{ github.sha }}\`
          - Branch: \`${{ github.ref_name }}\`
          - Triggered by: ${{ github.event_name }}

          **Build Artifacts:**
          - Package: \`${PACKAGE_NAME}\`
          - SHA256: \`${{ env.PACKAGE_SHA256 }}\`
          EOF

      - name: Create checksum file
        run: |
          echo "${PACKAGE_SHA256}  ${PACKAGE_NAME}" > "${PACKAGE_NAME}.sha256"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.ref_name }}"
          CHANGELOG=$(grep '^changelog[[:space:]]*=' manifest | sed 's/^changelog[[:space:]]*=[[:space:]]*//' | sed 's/<br>/\n/g')
          NOTES="${CHANGELOG}\n\n---\n**SHA256:** \`${PACKAGE_SHA256}\`"

          gh release create "$TAG" \
            "${PACKAGE_NAME}" \
            "${PACKAGE_NAME}.sha256" \
            --title "$TAG" \
            --notes "$(echo -e "$NOTES")"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
